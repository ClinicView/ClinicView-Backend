name: Backend CI

on:
  push:
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinicview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinicview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clinicview_test?schema=clinicview_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clinicview_test?schema=clinicview_e2e
      NODE_ENV: test
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ci-access-secret-clinicview-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-clinicview-not-for-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SESSION_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 1h
      AUDIT_HASH_SECRET: ci-audit-hmac-secret-clinicview-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Isolated E2E tests
        run: npm run test:e2e
